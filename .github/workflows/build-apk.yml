name: 构建 SpriteBonk Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: 编译 Android APK 安装包
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 设置 Android SDK 依赖环境
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: 自动接受 Android SDK 协议
        run: |
          yes | sdkmanager --licenses || true

      - name: 下载并配置 Godot 4.3 导出环境
        run: |
          mkdir -p tools/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O godot.zip
          unzip -q godot.zip -d tools/godot/
          mv tools/godot/Godot_v4.3-stable_linux.x86_64 tools/godot/godot
          chmod +x tools/godot/godot

          # 下载 Godot 4.3 官方导出模板 (Export Templates)
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O templates.tpz
          unzip -q templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* ~/.local/share/godot/export_templates/4.3.stable/
          rm -rf templates.tpz /tmp/templates godot.zip

      - name: 配置 Godot Android SDK 路径
        run: |
          mkdir -p ~/.config/godot
          cat << EOF > ~/.config/godot/editor_settings-4.tres
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF

      - name: 生成 Debug 签名密钥 (如项目未内置 Release 密钥)
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: 执行 Godot 无头导出 Android APK
        run: |
          mkdir -p build/android
          # 针对无 Release 密钥时，注入 debug 密钥到 export_presets.cfg
          DEBUG_KEYSTORE="$HOME/.android/debug.keystore"
          sed -i "s|keystore/debug=\"\"|keystore/debug=\"$DEBUG_KEYSTORE\"|g" export_presets.cfg
          sed -i 's|keystore/debug_user=""|keystore/debug_user="androiddebugkey"|g' export_presets.cfg
          sed -i 's|keystore/debug_password=""|keystore/debug_password="android"|g' export_presets.cfg

          # 导出 APK
          ./tools/godot/godot --headless --export-debug "Android" build/android/SpriteBonk-debug.apk || ./tools/godot/godot --headless --export-release "Android" build/android/SpriteBonk-debug.apk || true

          # 检查导出的 APK
          ls -lh build/android/

      - name: 归档并导出 SpriteBonk APK (Artifact)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: SpriteBonk-Android-APK
          path: build/android/*.apk
          retention-days: 14

      - name: 创建 GitHub Release 并直接发布 APK
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: "v1.0.0-ci-${{ github.run_number }}"
          name: "SpriteBonk Android CI Build #${{ github.run_number }}"
          body: "GitHub Actions 自动构建产物 (Commit: ${{ github.sha }})"
          draft: false
          prerelease: true
          files: build/android/SpriteBonk-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
