# Solana dApp Store — dapp-store CLI config (DRAFT, Phase D)
# Prepared up to the publisher-wallet step. Items marked TODO_PUBLISHER
# require the user's dedicated publisher wallet (never a main/trading
# wallet) plus a small SOL balance for the publisher/app/release NFT mint
# fees. Flow once the wallet exists:
#   npx dapp-store validate -k <publisher-keypair.json> -b <build-tools dir>
#   npx dapp-store create publisher -k ...   (writes publisher.address)
#   npx dapp-store create app -k ...         (writes app.address)
#   npx dapp-store create release -k ... -b <build-tools>  (writes release.address)
#   npx dapp-store publish submit -k ... -u <mainnet rpc> \
#       --requestor-is-authorized --complies-with-solana-dapp-store-policies
publisher:
  name: SpriteBonk
  # TODO_PUBLISHER: contact email for the publisher entity
  email: ""
  # TODO_PUBLISHER: publisher website (must NOT be changed without user approval if a business domain is used)
  website: ""
  address: "" # TODO_PUBLISHER: dedicated publisher wallet address (filled by `create publisher`)
  media:
    - purpose: icon
      uri: ./media/publisher-icon-512.png
      width: 512
      height: 512
app:
  name: SpriteBonk
  address: "" # filled by `create app`
  android_package: com.spritebonk.game
  urls:
    license_url: ""
    copyright_url: ""
    privacy_policy_url: "" # TODO: publish a privacy policy page before submission
    website: ""
  media:
    - purpose: icon
      uri: ./media/icon-512.png
      width: 512
      height: 512
release:
  version: 1.0.0
  address: "" # filled by `create release`
  media:
    - purpose: screenshot
      uri: ./screenshots/01_spawn.png
      width: 1920
      height: 1080
    - purpose: screenshot
      uri: ./screenshots/02_combat.png
      width: 1920
      height: 1080
    - purpose: screenshot
      uri: ./screenshots/03_guardian.png
      width: 1920
      height: 1080
    - purpose: screenshot
      uri: ./screenshots/04_portal.png
      width: 1920
      height: 1080
  files:
    - purpose: install
      uri: ../build/android/SpriteBonk.apk
  catalog:
    en-US:
      name: SpriteBonk
      short_description: "3D monster-taming survival arena. Play as guest."
      long_description: |
        SpriteBonk is a fast-paced 3D monster-taming survival arena. Choose your
        elemental companion, explore wild biomes, fend off endless monster waves,
        activate ancient elemental altars to defeat powerful zone guardians, and
        escape through the portal before the 10-minute swarm overwhelms you.

        Features:
        - Unique elemental starters with custom signature moves and evolutions
        - Full stage progression: roam -> activate altar -> defeat guardian -> portal
        - In-run ability draft, elemental reactions, and rogue-lite upgrades
        - Native Solana Mobile Wallet Adapter (MWA) support: connect your wallet or play as guest
        - No intrusive ads, no forced accounts, fair progression

        On-chain features ($SPRT token and Genesis NFT eligibility) are planned
        for a later season update and are not part of this release.
      new_in_version: "Initial release: 3 elemental starters, 4 biomes, guardian bosses, and native Solana Mobile Wallet Adapter."
    zh-CN:
      name: SpriteBonk
      short_description: "3D 幻兽生存竞技场，击退兽潮，逃出生天。游客免登秒开。"
      long_description: |
        《SpriteBonk》是一款快节奏 3D 幻兽生存竞技场游戏。选择你的元素伙伴，
        探索原野秘境，击退汹涌的野生怪物潮，激活远古祭坛迎战区域终极守护者，
        在 10 分钟倒计时兽潮降临前冲入传送门逃出生天。

        特色：
        - 三大元素初始伙伴，拥有专属标志招式与阶段进化形态
        - 完整关卡循环：旷野漫游 -> 激活祭坛 -> 击破守护者 -> 传送门进阶
        - 局内三选一技能构筑、元素克制反应与实验室深度强化
        - 支持原生 Solana 移动钱包 (MWA) 授权连接，亦可游客极速免登畅玩
        - 纯粹游戏体验，无强制弹窗广告，无复杂账号绑定

        链上功能（$SPRT 代币与 Genesis NFT 资格）将在后续赛季更新中推出，
        不属于本版本内容。
      new_in_version: "首发版本：3 大元素伙伴、4 大生态地带、守护者试炼与 Solana MWA 原生钱包支持。"
solana_mobile_dapp_publisher_portal:
  google_store_package: ""
  testing_instructions: "Guest play needs no account or wallet: launch the app, tap any starter, tap Start, and play with on-screen touch controls. Wallet connect (optional, read-only) is on the main menu — tap Wallet then Connect to authorize via Solana Mobile Wallet Adapter (MWA) and view your read-only short address and SOL balance, or tap Copy Address to copy it. No transactions or signing fees are possible in this build."
